        // いくとさんの考え：「÷4」に 赤い下線をひく（何でわっているか）
        if (s.ul) document.querySelectorAll('#fr-fig .fr-ul').forEach(e => e.classList.add('on'));
        // 積の大きさ：きまりの文を、式の行の下に出す（次の手順で 式の行を書きなおすと 消える）
        const cRow = s.hint && document.querySelector('#fr-rows .fr-slot.active');
        const cfRow = cRow && cRow.closest('.fr-row');
        if (cfRow && !cfRow.querySelector('.fr-hint')) {
            cfRow.style.position = 'relative';
            cfRow.insertAdjacentHTML('beforeend', `<div class="fr-hint" style="position: absolute; left: 0; top: 100%; white-space: nowrap; color: #d32f2f;">${s.hint}</div>`);
        }
    } else if (s.type === 'action') {
        document.getElementById(`btn-${s.expect}`).classList.add('hint-glow');
    } else if (s.type === 'click_cell') {
        document.getElementById(`cell-${s.expect}`).classList.add('hint-glow');
    } else if (s.type === 'click_cells') {
        s.expect.forEach(id => {
            if (!selectedCells.includes(id)) {
                document.getElementById(`cell-${id}`).classList.add('hint-glow');
            }
        });
    } else if (s.type === 'click_cells_group') {
        s.expectGroups.flat().forEach(id => {
            if (!selectedCells.includes(id)) {
                document.getElementById(`cell-${id}`).classList.add('hint-glow');
            }
        });
    } else if (s.type === 'input') {
        const cell = document.getElementById(`cell-${s.targetCell}`);
        const box = cell && cell.querySelector('.box-input');
        if (box) box.classList.add('hint-glow');
        // ヒントの式（帯分数を仮分数になおす式 など）を、分数の式の下に出す（次の手順で 式の行を書きなおすと 消える）
        const row = document.querySelector('#fr-rows .fr-slot.active');
        const fRow = row && row.closest('.fr-row');
        if (s.hint && fRow && !fRow.querySelector('.fr-hint')) {
            fRow.style.position = 'relative';   // 式の行のすぐ下に重ねる（ほかの行や式の位置は動かさない）
            fRow.insertAdjacentHTML('beforeend', `<div class="fr-hint" style="position: absolute; left: 0; top: 100%; white-space: nowrap; color: #d32f2f;">${s.hint}</div>`);
        }
        // ヒントで、上の式の 記号を うっすら かくす（2/9× を かくすと 8＋10 が のこる）。次の手順で 式の行を書きなおすと もとにもどる
        if (s.fade) document.querySelectorAll('#fr-rows [data-fd]').forEach(e => { e.style.transition = 'opacity 0.3s'; e.style.opacity = '0.15'; });
        // ヒントで約分して見せる（2/9 × 18：9 と 18 に ななめ線、9 の下に 1、18 の上に 2）。次の手順で 式の行を書きなおすと 消える
        if (s.kx) document.querySelectorAll('#fr-rows [data-kx]').forEach(e => {
            if (e.classList.contains('yk-strike')) return;
            e.classList.add('yk-strike');
            e.insertAdjacentHTML('beforeend', `<span class="yk-v" style="position: absolute; left: 50%; transform: translateX(-50%); ${e.dataset.kp === 'up' ? 'bottom' : 'top'}: 100%;">${e.dataset.kx}</span>`);
        });
        // ヒントで、約分した形を見せる（3/5 × 5/3 に ななめ線と 1）。次の手順で 式の行を書きなおすと 消える
        if (s.ka) document.querySelectorAll('#fr-rows .fr-kac').forEach(e => e.classList.add('on'));
        // ヒントで、整数・小数の下に 赤い横線と 分母（1・10）を書いて、分数の形を見せる（逆数）。次の手順で 式の行を書きなおすと 消える
        if (s.uh) document.querySelectorAll('#fr-rows [data-uh]').forEach(e => {
            if (e.querySelector('.fr-uh')) return;
            e.style.position = 'relative';
            e.insertAdjacentHTML('beforeend', `<span class="fr-uh" style="position: absolute; left: -6px; right: -6px; top: 100%; border-top: 3px solid #e53935; text-align: center; color: #e53935; font-size: 1.6rem; line-height: 1.2; padding-top: 2px;">${e.dataset.uh}</span>`);
        });
        // ヒントで、数直線に やじるしと「×3」を出す（文章題）。上は 上のラベルの あいだ、下は 下のラベルの あいだ
        const nl = document.querySelector('#fr-fig .nl[data-ar]');
        if (s.nla && nl && !nl.querySelector('.nl-ar')) {
            const [ti, tj, bi, bj] = nl.dataset.ar.split(',').map(Number);
            const T = nl.querySelectorAll('.nl-lab-t'), B = nl.querySelectorAll('.nl-lab-b');
            const nr = nl.getBoundingClientRect(), z = nr.width / parseFloat(nl.style.width);   // スマホの zoom の ぶん
            const lab = nl.querySelector('.nl-arlab').innerHTML;
            let svg = `<svg class="nl-ar" width="${nl.offsetWidth}" height="${nl.offsetHeight}" style="position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none;">` +
                      `<defs><marker id="nl-arm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e53935"/></marker></defs>`;
            let labs = '';
            [[T[ti], T[tj], true], [B[bi], B[bj], false]].forEach(([a, b, up]) => {
                if (!a || !b) return;
                const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect(), r = (ra.height <= rb.height) ? ra : rb;   // 高さは、低いほうの ラベルの まん中
                const ltr = ra.left < rb.left, X = v => (v - nr.left) / z;
                const x1 = X(ltr ? ra.right : ra.left) + (ltr ? 10 : -10), x2 = X(ltr ? rb.left : rb.right) + (ltr ? -10 : 10);
                const y = ((r.top + r.bottom) / 2 - nr.top) / z;
                svg += `<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="#e53935" stroke-width="3" marker-end="url(#nl-arm)"/>`;
                labs += `<span class="nl-arl nl-ar" style="left: ${(x1 + x2) / 2}px; top: ${y}px; transform: translate(-50%, ${up ? 'calc(-100% - 6px)' : '6px'});">${lab}</span>`;
            });
            nl.insertAdjacentHTML('beforeend', svg + '</svg>' + labs);
        }
        // ヒントで、入れかえる2つの分数の上に ⇔ の弧を出す（a×b＝b×a）
        const sw = document.querySelectorAll('#fr-rows [data-sw]');
        const swRow = sw.length === 2 ? sw[0].closest('.fr-row') : null;
        if (s.swap && swRow && !swRow.querySelector('.fr-sw')) {
            swRow.style.position = 'relative';
            const rr = swRow.getBoundingClientRect(), r1 = sw[0].getBoundingClientRect(), r2 = sw[1].getBoundingClientRect();
            const x1 = r1.left + r1.width / 2 - rr.left, x2 = r2.left + r2.width / 2 - rr.left, y = Math.min(r1.top, r2.top) - rr.top, W = x2 - x1, H = 26;
            swRow.insertAdjacentHTML('beforeend',
                `<svg class="fr-sw" width="${W}" height="${H}" style="position: absolute; left: ${x1}px; top: ${y - H}px; overflow: visible; pointer-events: none;">` +
                `<defs><marker id="fr-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d32f2f"/></marker></defs>` +
                `<path d="M3,${H} Q${W / 2},${-H * 0.8} ${W - 3},${H}" fill="none" stroke="#d32f2f" stroke-width="3" marker-start="url(#fr-ar)" marker-end="url(#fr-ar)"/></svg>`);
        }
        // ヒントで、(a＋b)×c の a と b から c に 弧の やじるしを出す（a×c＋b×c）
        const dl = document.querySelectorAll('#fr-rows [data-dl]');
        const dlRow = dl.length ? dl[0].closest('.fr-row') : null;
        const dlT = Array.from(dl).find(e => e.dataset.dl === 't');
        if (s.dla && dlRow && dlT && !dlRow.querySelector('.fr-dl')) {
            dlRow.style.position = 'relative';
            const rr = dlRow.getBoundingClientRect(), rt = dlT.getBoundingClientRect();
            const cx = r => r.left + r.width / 2 - rr.left;
            const tx = cx(rt), ty = rt.top - rr.top + 6;
            let paths = '';
            Array.from(dl).filter(e => e.dataset.dl === 's').forEach((e, k) => {
                // 遠い分数（1つめ）は 高い弧で 12 の右がわへ、近い分数（2つめ）は 低い弧で 12 の左がわへ（線が 重ならない）
                const r = e.getBoundingClientRect(), x1 = cx(r), y1 = r.top - rr.top - 2, x2 = tx + (k === 0 ? 7 : -7), H = (k === 0 ? 56 : 36);
                paths += `<path d="M${x1},${y1} Q${(x1 + x2) / 2},${Math.min(y1, ty) - H} ${x2},${ty}" fill="none" stroke="#d32f2f" stroke-width="3" marker-end="url(#fr-dla)"/>`;
            });
            dlRow.insertAdjacentHTML('beforeend',
                `<svg class="fr-dl" width="${rr.width}" height="${rr.height}" style="position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none;">` +
                `<defs><marker id="fr-dla" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d32f2f"/></marker></defs>` + paths + `</svg>`);
        }
    } else if (s.type === 'drag_drop') {
        document.getElementById('drag-target-span').classList.add('hint-glow');
        document.getElementById(`cell-${s.target}`).classList.add('hint-glow');
    }
});

// もう一度（＝新しい問題）
document.getElementById('btn-reset').addEventListener('click', initGame);

// 上のタブ
document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const wrap = GROUP_SUB[btn.dataset.group];
        if (wrap) {
            // いま選ばれている小タブの見本問題から始める
            const sub = document.querySelector(`#${wrap} .level-btn.active`)
                     || document.querySelector(`#${wrap} .level-btn`);
            currentMode = sub.dataset.mode;
        } else {
            currentMode = btn.dataset.mode;
        }
        forceProblem = TAB_PROBLEM[currentMode] || null;
        if (chal.on) chalReset();   // タブを変えたら、10問チャレンジは最初から
        initGame();
    });
});

// 小タブ
Object.values(GROUP_SUB).forEach(id => {
    document.querySelectorAll(`#${id} .level-btn`).forEach(btn => {
        btn.addEventListener('click', () => {
            btn.parentElement.querySelectorAll('.level-btn').forEach(b => b.classList.toggle('active', b === btn));
            currentMode = btn.dataset.mode;
            forceProblem = TAB_PROBLEM[currentMode] || null;   // 最初の1問は見本問題
            playSound('click');
            if (chal.on) chalReset();                          // 小タブを変えたら、10問チャレンジは最初から
            initGame();
        });
    });
});

// =====================================================================
// 1問はじめる（タブ・小タブ・もう一度・10問チャレンジの次の問題・テストの練習 から呼ばれる）
// =====================================================================
function initGame() {
    mode = currentMode;
    chal.missNow = 0;   // 10問チャレンジ：この問題でまちがえた回数
    // いまのモードの小タブだけ出す
    Object.values(GROUP_SUB).forEach(id => {
        const w = document.getElementById(id);
        w.style.display = w.querySelector(`.level-btn[data-mode="${mode}"]`) ? 'flex' : 'none';
    });
    generateProblem();
    forceProblem = null;   // 見本問題は1回だけ
    generateStates();
    state = 0;
    selectedCells = [];

    startTime = Date.now();
    errorStats = { tateru: 0, kakeru: 0, hiku: 0, orosu: 0, other: 0 };
    document.querySelectorAll('.guide-arrow').forEach(el => el.remove());

    // UIリセット
    document.querySelectorAll('.cell').forEach(cell => {
        cell.innerText = '';
        cell.innerHTML = '';
        cell.className = 'cell';
    });
    document.getElementById('hanamaru').classList.remove('show');

    // 計算タブ：マスの代わりに式の板を出して、ここで終わり
    const kei = isKei(mode);
    const fr = isFr(mode);
    document.querySelector('.grid').style.display = (kei || fr) ? 'none' : 'grid';
    document.getElementById('kei-panel').style.display = kei ? 'flex' : 'none';
    document.getElementById('fr-panel').style.display = fr ? 'flex' : 'none';
    document.querySelector('.controls').classList.toggle('kei-mode', kei || fr);
    if (kei) {
        renderKeiBoxes();
        updateUI();
        return;
    }
    // 分数のタブ：問題文・図・式の板を出して、ここで終わり
    if (fr) {
        renderFrStatic();
        updateUI();
        return;
    }

    // わり算の筆算：罫線（商の上線・ひき算の線。ひき算の線は border-hidden でかくしておく）
    if (mode === '3digit1') {
        [3, 4, 5].forEach(c => document.getElementById(`cell-r0-c${c}`).classList.add('border-bottom'));
        [3, 4].forEach(c => {
            document.getElementById(`cell-r2-c${c}`).classList.add('border-bottom', 'border-hidden');
            document.getElementById(`cell-r4-c${c}`).classList.add('border-bottom', 'border-hidden');
        });
        [4, 5].forEach(c => document.getElementById(`cell-r6-c${c}`).classList.add('border-bottom', 'border-hidden'));
    } else if (mode === '3digit2') {
        [3, 4, 5].forEach(c => document.getElementById(`cell-r0-c${c}`).classList.add('border-bottom'));
        [3, 4].forEach(c => document.getElementById(`cell-r2-c${c}`).classList.add('border-bottom', 'border-hidden'));
        [4, 5].forEach(c => document.getElementById(`cell-r4-c${c}`).classList.add('border-bottom', 'border-hidden'));
    } else {
        [3, 4].forEach(c => document.getElementById(`cell-r0-c${c}`).classList.add('border-bottom'));
        [3, 4].forEach(c => {
            document.getElementById(`cell-r2-c${c}`).classList.add('border-bottom', 'border-hidden');
            document.getElementById(`cell-r4-c${c}`).classList.add('border-bottom', 'border-hidden');
        });
    }

    // 「）」：わられる数が始まるセルの左端
    document.getElementById('cell-r1-c3').classList.add('paren-left');

    // 問題のセット：わる数 c2 ／ わられる数 c3から右へ
    document.getElementById('cell-r1-c2').innerText = divisor;
    if (mode !== '2digit') {
        document.getElementById('cell-r1-c3').innerText = Math.floor(dividend / 100);
        document.getElementById('cell-r1-c4').innerText = Math.floor((dividend % 100) / 10);
        document.getElementById('cell-r1-c5').innerText = dividend % 10;
    } else {
        document.getElementById('cell-r1-c3').innerText = Math.floor(dividend / 10);
        document.getElementById('cell-r1-c4').innerText = dividend % 10;
    }

    updateUI();
}

// 起動：最初の1問も見本問題から
forceProblem = TAB_PROBLEM[currentMode] || null;
window.onload = () => { initGame(); };
</script>

<script>
/* 小タブの 一覧（タブの ボタンから 作る）*/
const MODES = {};
document.querySelectorAll('#mode-tabs .tab-btn').forEach(tab => {
  const label = tab.textContent.trim();
  if (tab.dataset.mode) { MODES[tab.dataset.mode] = { label: label }; return; }
  const wrap = document.getElementById(GROUP_SUB[tab.dataset.group]);
  if (!wrap) return;
  wrap.querySelectorAll('.level-btn[data-mode]').forEach(b => {
    MODES[b.dataset.mode] = { label: label, sub: '（' + b.textContent.trim() + '）' };
  });
});

/* 小タブを 開く（タブを おしたのと 同じ 見た目に して、新しい 問題を 出す）*/
function setMode(name) {
  const sub = document.querySelector('.level-wrap .level-btn[data-mode="' + name + '"]');
  let tab = null;
  if (sub) {
    sub.parentElement.querySelectorAll('.level-btn').forEach(b => b.classList.toggle('active', b === sub));
    const g = Object.keys(GROUP_SUB).find(k => GROUP_SUB[k] === sub.parentElement.id);
    tab = document.querySelector('#mode-tabs .tab-btn[data-group="' + g + '"]');
  } else {
    tab = document.querySelector('#mode-tabs .tab-btn[data-mode="' + name + '"]');
  }
  document.querySelectorAll('#mode-tabs .tab-btn').forEach(b => b.classList.toggle('active', b === tab));
  currentMode = name;
  forceProblem = window.TEST_MIHON ? (TAB_PROBLEM[name] || null) : null;   // テストでは ふつう ランダムの 問題
  initGame();
}

/* はなまる・まちがいの 知らせ口 */
function showHanamaru() { if (window.TestRun && TestRun.on()) TestRun.onDone(); }
function applyJudge(r)  { if (window.TestRun && r && !r.ok && !r.skip) TestRun.miss(); }

/* 本体の はなまる・まちがいを つつんで、上の 知らせ口を よぶ */
{
  const _clear = showClearEffect;
  showClearEffect = function () { const v = _clear.apply(this, arguments); showHanamaru(); return v; };
  const _wrong = handleWrong;
  handleWrong = function () { applyJudge({ ok: false }); return _wrong.apply(this, arguments); };
}

window.Challenge10 = { isOn: () => chal.on };

<!-- ============================================================
     📝 テストの 練習 ②しくみ（test_renshu v1・2026-09-26）— さわらない
     shukuzu1.html の B1 を、ほかの アプリでも つかえるように 取り出したもの。

     ・10問チャレンジ（Challenge10）とは べつの しくみ。始めると チャレンジは 切る。
     ============================================================ -->
<script>
window.TestRun = (function(){
  'use strict';
  const S = window.TEST_SETTEI;
  const P = Object.assign({ after:'#chal-mount', next:'#next', hint:'#hintBtn',
                            tabs:'#gtabs,#subTabs', chalBtn:'#btn-challenge' }, (S && S.parts) || {});
  const $ = id => document.getElementById(id);
  const q = sel => sel ? document.querySelector(sel) : null;

  /* ---- 土台に 必要な ものが あるか ---- */
  const lack = [];
  if(typeof MODES        !== 'object')   lack.push('MODES');
  if(typeof setMode      !== 'function') lack.push('setMode');
  if(typeof showHanamaru !== 'function') lack.push('showHanamaru');
  if(typeof applyJudge   !== 'function') lack.push('applyJudge');
  if(!S || !Array.isArray(S.tests) || !S.tests.length) lack.push('TEST_SETTEI.tests');
  if(lack.length){ console.warn('テストの練習：土台に ないので うごきません →', lack.join('・')); return null; }

  /* ---- せっていを たしかめる（ない 小タブは とばす）---- */
  const TESTS = S.tests.map(t => ({
    title: t.title || 'テスト',
    items: (t.items || []).filter(it => {
      if(it && MODES[it.mode]) return true;
      console.warn('テストの練習：小タブ「' + (it && it.mode) + '」が ないので とばします（' + t.title + '）');
      return false;
    })
  })).filter(t => t.items.length);
  if(!TESTS.length){ console.warn('テストの練習：出せる 大問が ありません'); return null; }

  const setOf = it => Object.assign({}, it.meth !== undefined ? { meth: it.meth } : {}, it.set || {});
  const itemName = it => it.name || ((MODES[it.mode].label || it.mode) + (MODES[it.mode].sub || ''));
  const nowMode = () => (typeof mode === 'string' ? mode : '');
  const waitMs = () => (typeof HANAMARU_SHOW_MS === 'number' ? HANAMARU_SHOW_MS : 2000)
                     + (typeof AUTO_NEXT_MS     === 'number' ? AUTO_NEXT_MS     : 1500);

  let run = null;   // { t, i, rec:[{miss,hint,st}], back, saved }
  let myTimer = 0;

  /* ---- 見た目（CSS は ここで 足す。土台の <style> は さわらない）---- */
  const css = document.createElement('style');
  css.id = 'test-style';
  css.textContent = [
    '#test-mount{position:relative;flex:0 0 auto;display:flex;align-items:center;}',
    '#test-btn{font-family:"Yusei Magic",sans-serif;font-size:clamp(13px,1.7vw,17px);padding:5px 14px;white-space:nowrap;',
    '  color:#138577;background:#e3f6f2;border:2px solid #7fd3c6;border-radius:20px;box-shadow:0 2px 0 #7fd3c6;cursor:pointer;}',
    '#test-btn:focus-visible,#test-menu button:focus-visible,#test-bar button:focus-visible,#test-result button:focus-visible{outline:3px solid #138577;outline-offset:2px;}',
    '#test-menu{display:none;position:absolute;top:calc(100% + 8px);right:0;z-index:950;background:#fff;border:3px solid #d8ccae;',
    '  border-radius:16px;padding:10px;box-shadow:0 8px 24px rgba(52,70,95,.20);flex-direction:column;gap:8px;min-width:270px;max-width:92vw;}',
    '#test-menu.open{display:flex;}',
    '#test-menu button{font-family:"Yusei Magic",sans-serif;font-size:17px;padding:11px 14px;border-radius:12px;border:3px solid #7fd3c6;',
    '  background:#fff;color:#34465f;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:14px;white-space:nowrap;}',
    '#test-menu button:hover{background:#f1fbf9;}',
    '#test-menu small{font-size:14px;color:#6a7d96;}',
    '#test-bar{display:none;align-items:center;gap:8px;background:rgba(255,255,255,.94);border:2px solid #7fd3c6;border-radius:20px;',
    '  padding:3px 5px 3px 12px;font-family:"Yusei Magic",sans-serif;color:#138577;white-space:nowrap;font-size:clamp(12px,1.5vw,16px);}',
    '#test-dots{letter-spacing:1px;}',
    '#test-stop{font-family:"Yusei Magic",sans-serif;font-size:.9em;padding:3px 10px;border-radius:14px;border:2px solid #d8ccae;background:#fff;color:#6a7d96;cursor:pointer;}',
    'body.testing #test-btn{display:none;}',
    'body.testing #test-bar{display:flex;}',
    'body.testing #chal-mount{display:none;}',
    P.tabs.split(',').map(s => 'body.testing ' + s.trim()).join(',') + '{pointer-events:none;opacity:.45;}',
    '#test-result{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;align-items:center;justify-content:center;}',
    '#test-result.show{display:flex;}',
    '#test-result .tr-card{background:#fff;border-radius:20px;padding:22px 26px;box-shadow:0 10px 40px rgba(0,0,0,.3);max-width:94vw;max-height:92vh;overflow:auto;',
    '  font-family:"Yusei Magic",sans-serif;color:#34465f;}',
    '#test-result .tr-title{font-size:clamp(20px,3vw,28px);color:#138577;text-align:center;margin-bottom:12px;}',
    '#test-result table{border-collapse:collapse;font-size:clamp(14px,2vw,19px);margin:0 auto;}',
    '#test-result td{padding:6px 10px;border-bottom:2px dashed #eadfc6;white-space:nowrap;}',
    '#test-result td.no{color:#6a7d96;}',
    '#test-result td.r-ok{color:#2bb673;}',
    '#test-result td.r-ng{color:#e85d3b;}',
    '#test-result td.r-sk{color:#9aa6b5;}',
    '#test-result .tr-sum{text-align:center;margin-top:12px;font-size:clamp(16px,2.4vw,22px);}',
    '#test-result .tr-sum b{color:#e85d3b;font-size:1.3em;}',
    '#test-result .tr-btns{display:flex;gap:12px;justify-content:center;margin-top:16px;}',
    '#test-result button{font-family:"Yusei Magic",sans-serif;font-size:18px;padding:11px 20px;border-radius:14px;cursor:pointer;}',
    '#test-again{color:#fff;background:#1fae9c;border:none;box-shadow:0 3px 0 #138577;}',
    '#test-close{color:#6a7d96;background:#fff;border:2px solid #d8ccae;}'
  ].join('\n');
  document.head.appendChild(css);

  /* ---- ボタン・メニュー・帯（10問チャレンジの となり）---- */
  const mount = document.createElement('div');
  mount.id = 'test-mount';
  mount.innerHTML =
      '<button id="test-btn" type="button">' + (S.button || '📝 テストの 練習') + '</button>'
    + '<div id="test-menu">'
    +   TESTS.map((t,k) => '<button type="button" data-k="'+k+'">'+t.title+'<small>'+t.items.length+'問</small></button>').join('')
    + '</div>'
    + '<div id="test-bar"><span id="test-no"></span><span id="test-dots"></span>'
    +   '<button id="test-stop" type="button">やめる</button></div>';
  const anchor = q(P.after);
  const header = document.querySelector('header');
  if(anchor && anchor.parentNode) anchor.parentNode.insertBefore(mount, anchor.nextSibling);
  else if(header) header.appendChild(mount);
  else document.body.insertBefore(mount, document.body.firstChild);
  const res = document.createElement('div');
  res.id = 'test-result';
  document.body.appendChild(res);

  /* テストが 1つだけなら、メニューを 出さずに すぐ 始める */
  $('test-btn').addEventListener('click', e => {
    e.stopPropagation();
    if(TESTS.length === 1){ start(0); return; }
    const m = $('test-menu');
    m.classList.toggle('open');
    if(m.classList.contains('open')) placeMenu();
  });
  /* せまい 画面で メニューが 左に はみ出す ときは、画面の 中へ ずらす */
  function placeMenu(){
    const m = $('test-menu');
    m.style.left = ''; m.style.right = '';
    const r = m.getBoundingClientRect(), mr = mount.getBoundingClientRect();
    if(r.left < 8){ m.style.right = 'auto'; m.style.left = (8 - mr.left) + 'px'; }
  }
  $('test-menu').addEventListener('click', e => {
    const b = e.target.closest('button[data-k]'); if(!b) return;
    $('test-menu').classList.remove('open');
    start(+b.dataset.k);
  });
  document.addEventListener('click', e => {
    if(!e.target.closest('#test-mount')) $('test-menu').classList.remove('open');
  });
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape') $('test-menu').classList.remove('open');
  });
  $('test-stop').addEventListener('click', () => stop());
  /* テストの あいだの「つぎの もんだい」は、その 大問を とばして つぎの 大問へ */
  document.addEventListener('click', e => {
    if(!run || !P.next || !e.target.closest(P.next)) return;
    e.stopPropagation(); e.preventDefault();
    skip();
  }, true);
  /* ヒントを 見たか（ボタンを おした あと hintOn が true なら）*/
  const hb = q(P.hint);
  if(hb) hb.addEventListener('click', () => setTimeout(() => {
    const r = cur();
    const on = (typeof hintOn === 'boolean') ? hintOn : true;
    if(r && on && r.st === 'todo') r.hint = true;
  }, 0));

  /* ---- 土台の 2つの 関数を つつむ（土台に もう 2行 入っていれば つつまない）---- */
  const BUILTIN = /TestRun/.test(String(showHanamaru)) || /TestRun/.test(String(applyJudge));
  if(!BUILTIN){
    const _show = showHanamaru;
    showHanamaru = function(){
      if(!run) return _show.apply(this, arguments);
      /* はなまるは ふつうに 出す。同じ モードの つぎの 問題へは 行かせない（noAutoNext を 一時的に）*/
      const m = (typeof M === 'object' && M) ? M : null;
      const had = m && Object.prototype.hasOwnProperty.call(m, 'noAutoNext');
      const old = m ? m.noAutoNext : undefined;
      try{ if(m) m.noAutoNext = true; }catch(e){}
      try{ _show.apply(this, arguments); }
      finally{ try{ if(m){ if(had) m.noAutoNext = old; else delete m.noAutoNext; } }catch(e){} }
      api.onDone();
    };
    const _judge = applyJudge;
    applyJudge = function(r){
      if(run && r && !r.ok && !r.skip) api.miss();
      return _judge.apply(this, arguments);
    };
  }

  /* ---- 中身 ---- */
  function cur(){ return run ? run.rec[run.i] : null; }
  function clearMine(){ clearTimeout(myTimer); myTimer = 0; }
  function bar(){
    if(!run) return;
    const T = TESTS[run.t], it = T.items[run.i];
    $('test-no').textContent = '📝 ' + (/^\d+$/.test(it.no) ? it.no+'問め' : it.no) + '（' + (run.i+1) + '／' + T.items.length + '）';
    $('test-dots').textContent = run.rec.map((r,i) => r.st==='done' ? '●' : r.st==='skip' ? '－' : (i===run.i ? '◎' : '○')).join('');
  }
  /* set で かえる 値を、はじめに 1回だけ おぼえておく */
  function saveSets(t){
    const saved = {};
    TESTS[t].items.forEach(it => {
      const o = setOf(it), md = MODES[it.mode];
      Object.keys(o).forEach(k => {
        const key = it.mode + '\u0000' + k;
        if(!(key in saved)) saved[key] = { md:md, k:k, had:Object.prototype.hasOwnProperty.call(md,k), v:md[k] };
      });
    });
    return saved;
  }
  function restoreSets(saved){
    Object.keys(saved || {}).forEach(key => {
      const s = saved[key];
      try{ if(s.had) s.md[s.k] = s.v; else delete s.md[s.k]; }catch(e){}
    });
  }
  function go(i){
    clearMine();
    run.i = i;
    const it = TESTS[run.t].items[i];
    const o = setOf(it);
    Object.keys(o).forEach(k => { try{ MODES[it.mode][k] = o[k]; }catch(e){} });
    setMode(it.mode);
    bar();
  }
  function start(t){
    const cb = q(P.chalBtn);
    if(window.Challenge10 && Challenge10.isOn && Challenge10.isOn() && cb) cb.click();
    res.classList.remove('show');
    let back = nowMode();
    if(run){ back = run.back; restoreSets(run.saved); }
    run = { t:t, i:0, rec:TESTS[t].items.map(() => ({ miss:0, hint:false, st:'todo' })), back:back, saved:saveSets(t) };
    document.body.classList.add('testing');
    go(0);
  }
  function next(){
    if(!run) return;
    if(run.i + 1 < run.rec.length) go(run.i + 1);
    else finish();
  }
  function skip(){
    const r = cur(); if(!r) return;
    if(r.st !== 'done') r.st = 'skip';
    clearMine();
    if(typeof clearAutoNext === 'function') clearAutoNext();
    next();
  }
  function finish(){
    clearMine();
    const T = TESTS[run.t];
    let perfect = 0;
    const rows = T.items.map((it,i) => {
      const r = run.rec[i];
      let tx, c;
      if(r.st==='done' && r.miss===0){ tx = '⭕ ノーミス'; c = 'r-ok'; perfect++; }
      else if(r.st==='done'){ tx = 'まちがい '+r.miss+'回'; c = 'r-ng'; }
      else { tx = 'とばした'; c = 'r-sk'; }
      return '<tr><td class="no">'+it.no+'</td><td>'+itemName(it)+'</td><td class="'+c+'">'+tx+'</td><td>'+(r.hint ? '💡' : '')+'</td></tr>';
    }).join('');
    res.innerHTML = '<div class="tr-card">'
      + '<div class="tr-title">📝 '+T.title+'　おわり！</div>'
      + '<table>'+rows+'</table>'
      + '<div class="tr-sum">ノーミスで できた 問題　<b>'+perfect+'</b> ／ '+T.items.length+'</div>'
      + '<div class="tr-btns"><button id="test-again" type="button">もう一度</button><button id="test-close" type="button">とじる</button></div>'
      + '</div>';
    res.classList.add('show');
    $('test-again').onclick = () => start(run.t);
    $('test-close').onclick = () => stop();
    $('test-again').focus();
  }
  /* やめる／とじる：set で かえた 値を もどして、はじめの タブへ */
  function stop(){
    if(!run) return;
    const back = run.back, saved = run.saved;
    run = null;
    clearMine();
    res.classList.remove('show');
    document.body.classList.remove('testing');
    restoreSets(saved);
    setMode(back && MODES[back] ? back : TESTS[0].items[0].mode);
  }

  const api = {
    on: () => !!run,
    /* showHanamaru から：その 大問は おわり。はなまるの あと つぎの 大問へ */
    onDone(){
      if(!run || res.classList.contains('show')) return !!run;
      const r = cur(); r.st = 'done';
      bar();
      clearMine();
      const go2 = () => { if(typeof autoTimers !== 'undefined') autoTimers = []; next(); };
      if(typeof autoTimers !== 'undefined' && Array.isArray(autoTimers)) autoTimers.push(setTimeout(go2, waitMs()));
      else myTimer = setTimeout(go2, waitMs());
      return true;
    },
    /* applyJudge から：まちがい（skip で ない もの）*/
    miss(){ const r = cur(); if(r && r.st === 'todo') r.miss++; },
    /* 外から つかう とき用 */
    start: t => start(t || 0),
    stop:  () => stop(),
    record: () => run ? JSON.parse(JSON.stringify(run.rec)) : null
  };
  return api;
})();
</script>
<!-- 📝 テストの 練習 ここまで -->
